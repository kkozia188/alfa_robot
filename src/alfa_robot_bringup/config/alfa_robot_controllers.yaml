#
# Gazebo (GZ) / ros2_control: base, left arm, right arm, wheels (velocity).
# Position: base (turn, updown), left_arm (leftarmbase, leftjoint1-4), right_arm (rightarmbase, rightjoint1-4).
# Velocity: forward_velocity_controller (left_back, left_forward, right_back, right_forward).
#

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    base_position_controller:
      type: forward_command_controller/ForwardCommandController

    left_arm_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_arm_position_controller:
      type: forward_command_controller/ForwardCommandController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    all_position_controller:
      type: forward_command_controller/ForwardCommandController

base_position_controller:
  ros__parameters:
    joints:
      - turn
      - updown
    interface_name: position

left_arm_position_controller:
  ros__parameters:
    joints:
      - leftarmbase
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
    interface_name: position

right_arm_position_controller:
  ros__parameters:
    joints:
      - rightarmbase
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
    interface_name: position

forward_velocity_controller:
  ros__parameters:
    joints:
      - left_back
      - left_forward
      - right_back
      - right_forward
    interface_name: velocity

# GUI 调试用：一个控制器覆盖全部 13 个位置关节
all_position_controller:
  ros__parameters:
    joints:
      - turn
      - updown
      - leftarmbase
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - leftjoint5
      - rightarmbase
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
    interface_name: position
