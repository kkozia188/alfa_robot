name: cuRobo core contracts

on:
  pull_request:
    branches: [alfa_v3_curobo]
    paths:
      - research/curobo_v3/**
      - .github/workflows/curobo-core.yml
  push:
    branches: [alfa_v3_curobo]
    paths:
      - research/curobo_v3/**
      - .github/workflows/curobo-core.yml

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy scipy
      - name: Independent scene and state tests
        working-directory: research/curobo_v3
        run: python -m unittest discover -s tests -p 'test_core_*.py' -v
      - name: Core syntax
        working-directory: research/curobo_v3
        run: python -m compileall -q tools/curobo_core tools/v3_plan_cycle.py tools/v3_core_smoke.py tools/v3_conveyor_snapshot_demo.py tools/v3_conveyor_snapshot_check.py tools/v3_curobo_import_audit.py
