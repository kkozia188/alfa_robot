# Real hardware controllers for MoveIt execution and GUI slider control.
# Current model exposes position controllers for torso and dual six-axis arms.

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    torso_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    all_position_controller:
      type: forward_command_controller/ForwardCommandController

torso_group_controller:
  ros__parameters:
    joints:
      - pitch
      - turn
      - updown
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_arm_controller:
  ros__parameters:
    joints:
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - leftjoint5
      - leftjoint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
      - rightjoint5
      - rightjoint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

dual_arm_controller:
  ros__parameters:
    joints:
      - pitch
      - turn
      - updown
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - leftjoint5
      - leftjoint6
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
      - rightjoint5
      - rightjoint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

all_position_controller:
  ros__parameters:
    joints:
      - pitch
      - turn
      - updown
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - leftjoint5
      - leftjoint6
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
      - rightjoint5
      - rightjoint6
    interface_name: position
