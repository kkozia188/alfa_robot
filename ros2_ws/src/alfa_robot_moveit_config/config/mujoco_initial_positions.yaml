# Default MuJoCo seed positions for the current alfa_robot model.
# Robot joints are synced with the all-zero MoveIt startup pose.

initial_positions:
  # Cargo front face is at x=4.45 m in scene.xml; base_x=3.65 keeps the
  # robot base frame 0.8 m in front of that face, inside the container.
  base_x: 3.65
  # Align robot center with the fourth cargo column across container width.
  base_y: 0.43333333
  base_yaw: 0
  pitch: 0
  turn: 0
  updown: 0.0
  leftjoint1: 0
  leftjoint2: 0.0
  leftjoint3: 0.0
  leftjoint4: 0
  leftjoint5: 0.0
  leftjoint6: 0
  rightjoint1: 0
  rightjoint2: 0.0
  rightjoint3: 0.0
  rightjoint4: 0
  rightjoint5: 0.0
  rightjoint6: 0
