/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1
        max_iteration: 3
        filter_size_surf: 0.2
        filter_size_map: 0.2
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        initial_align:
            enable: false
            initial_map_pcd: ""
            frames: 50
            leaf_size: 0.2
            save_aligned_map: false
            aligned_map_filename: "scans.pcd"
            icp_max_iterations: 50.0
            icp_correspondence_distance: 0.5

        preprocess:
            lidar_type: 1                # 1 for Livox
            scan_line:  4
            blind: 0.4
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  true
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            # 
            extrinsic_R: [ 0., 1., 0.,
                          -1., 0., 0.,
                           0., 0., 1.]
            # 
            gravity_alignment: true
            init_imu_orientation_from_gravity: true
            fix_imu_orientation_when_static: true
            publish_imu_tf: true

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: true
            scan_bodyframe_pub_en: true
            #
            lidar_frame: laser_link
            imu_frame: imu_link
            base_frame: base_link
            world_frame: camera_init

        pcd_save:
            pcd_save_en: true
            interval: -1
