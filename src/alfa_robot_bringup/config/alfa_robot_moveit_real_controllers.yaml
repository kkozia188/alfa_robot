# Real hardware controllers for MoveIt execution and GUI slider control.
# This config exposes FollowJointTrajectory action servers that MoveIt can use
# to execute planned trajectories on the actual hardware interface.

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    torso_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # GUI 滑块直驱：12 关节单一前向位置控制器，无插值。
    all_position_controller:
      type: forward_command_controller/ForwardCommandController

torso_group_controller:
  ros__parameters:
    joints:
      - turn
      - updown
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_arm_controller:
  ros__parameters:
    joints:
      - leftarmbase
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - rightarmbase
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

all_position_controller:
  ros__parameters:
    joints:
      - turn
      - updown
      - leftarmbase
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - leftjoint5
      - rightarmbase
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
    interface_name: position
