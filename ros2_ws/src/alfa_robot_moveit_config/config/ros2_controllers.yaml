# 双控制器: torso (pitch/turn) + dual_arm (updown + 12臂关节)

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

torso_controller:
  ros__parameters:
    joints:
      - pitch
      - turn
    command_interfaces:
      - position
    state_interfaces:
      - position

dual_arm_controller:
  ros__parameters:
    joints:
      - updown
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - leftjoint5
      - leftjoint6
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
      - rightjoint5
      - rightjoint6
    command_interfaces:
      - position
    state_interfaces:
      - position
