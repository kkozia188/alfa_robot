controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

dual_arm_controller:
  ros__parameters:
    # Mock demo controller. Partial arm goals keep all omitted V3.1.1 joints unchanged.
    allow_partial_joints_goal: true
    joints: &v311_demo_joints
      - rear_suspension_joint
      - front_left_steering_joint
      - front_left_wheel_joint
      - front_right_steering_joint
      - front_right_wheel_joint
      - rear_left_steering_joint
      - rear_left_wheel_joint
      - rear_right_steering_joint
      - rear_right_wheel_joint
      - updown
      - head_joint
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - left_hand_joint
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
      - right_hand_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
